# Model Training & Raspberry Pi 4 Deployment Configuration
# Matches the deployed 2-class Kaggle-trained YOLO26 weights (0: crop, 1: weed).

classes:
  - crop
  - weed

num_classes: 2

# Primary Real-Time Detector (YOLO26 -> NCNN on Pi 4)
# Provisional Pi 4 default: YOLO26n (higher weed recall 0.7459 & 3x faster NCNN than YOLO26s)
yolo:
  primary_model: "yolo26n.pt"                 # Provisional Pi 4 default (speed + weed recall)
  accuracy_candidate: "yolo26s.pt"            # Higher overall mAP50 / crop precision
  experiment_model: "yolo26m.pt"              # Optional PC-only high-capacity experiment
  deployed_model: "models/weed_detector_ncnn_model"
  fallback_weights:
    - "models/yolo26n_best.pt"
    - "models/yolo26n_best.onnx"
    - "models/yolo26s_ncnn_model"
    - "models/yolo26s_best.pt"
  input_size: 640
  conf_threshold: 0.30
  batch_size: -1
  epochs: 80
  patience: 20
  augment: true
  export_format: "ncnn"
  half: true

# Optional Offline Research Tools (disabled in real-time Pi 4 deployment)
efficientnet:
  enabled: false
  backbone: "efficientnet_b0"
  input_size: 224

dinov2:
  enabled: false
  model: "facebook/dinov2-small"
  input_size: 518
  feature_dim: 384
  frozen: true

clip:
  enabled: false
  model: "ViT-B/32"
  input_size: 224
