# Model Training & Raspberry Pi 4 Deployment Configuration

# Classes (matching configs/weed_data.yaml)
classes:
  - crop_tomato
  - crop_chili
  - crop_flower
  - weed_grass
  - weed_dandelion
  - weed_purslane
  - weed_amaranth
  - weed_other

num_classes: 8

# Primary Real-Time Detector (YOLO26 -> NCNN on Pi 4)
yolo:
  primary_model: "yolo26s.pt"       # Primary candidate (best accuracy/speed balance)
  fallback_model: "yolo26n.pt"      # Fallback if YOLO26s is too slow/hot on Pi 4
  experiment_model: "yolo26m.pt"    # Optional PC-only high-capacity experiment
  deployed_model: "models/weed_detector_ncnn_model"  # Exported NCNN directory for Pi 4
  fallback_weights:
    - "models/yolo_weeds.pt"
    - "../weed_detection_bot/yolo_models/best.onnx"
    - "../weed_detection_bot/yolo_models/best.pt"
  input_size: 640
  conf_threshold: 0.30
  batch_size: -1                    # Auto-batch on GPU during training
  epochs: 200
  patience: 40
  augment: true
  export_format: "ncnn"
  half: true

# Optional Offline Research Tools (disabled in real-time Pi 4 deployment)
efficientnet:
  enabled: false
  backbone: "efficientnet_b0"
  input_size: 224

dinov2:
  enabled: false
  model: "facebook/dinov2-small"
  input_size: 518
  feature_dim: 384
  frozen: true

clip:
  enabled: false
  model: "ViT-B/32"
  input_size: 224
  text_prompts:
    - "a photo of a tomato plant"
    - "a photo of a chili pepper plant"
    - "a photo of a flower plant"
    - "a photo of grass weed"
    - "a photo of dandelion weed"
    - "a photo of purslane weed"
    - "a photo of amaranth weed"
    - "bare soil"
    - "rock or debris"
